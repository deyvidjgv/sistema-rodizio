<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#c67139">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rodizio">
<title>Rodizio · Meseros</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<style>
  h1,h2,h3,h4{font-family:var(--font-heading);font-weight:400;margin:0}
  input{font-family:inherit}
  button{cursor:pointer}
  @keyframes rzPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
  @keyframes rzUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes rzToast{0%{opacity:0;transform:translate(-50%,10px)}10%,90%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
  #app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative;display:flex;flex-direction:column}

  /* ── Auth ── */
  .auth-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 22px}
  .auth-logo{width:64px;height:64px;border-radius:20px;background:var(--color-accent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:var(--shadow-md)}
  .auth-logo svg{width:34px;height:34px}
  .auth-title{text-align:center;font-size:30px;margin-bottom:2px}
  .auth-sub{text-align:center;color:var(--color-neutral-600);font-size:13.5px;margin-bottom:22px}
  .seg{display:flex;gap:4px;background:var(--color-surface);border-radius:999px;padding:4px;margin-bottom:20px}
  .seg button{flex:1;min-height:46px;border-radius:999px;border:0;font-size:14px;font-weight:600;background:transparent;color:var(--color-neutral-700)}
  .seg button.on{background:var(--color-bg);color:var(--color-text);box-shadow:var(--shadow-sm)}
  .field{margin-bottom:12px}
  .field input{width:100%;border:1px solid var(--color-divider);background:var(--color-neutral-100);border-radius:999px;padding:14px 18px;font-size:15px;min-height:52px;color:var(--color-text)}
  .field input:focus{outline:2px solid var(--color-accent);outline-offset:1px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{display:flex;align-items:center;gap:7px;border:1px solid var(--color-divider);background:var(--color-neutral-100);border-radius:999px;padding:7px 13px 7px 7px;font-size:13px;font-weight:600}
  .chip .av{width:22px;height:22px;border-radius:50%;background:var(--color-accent-300);color:var(--color-accent-700);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
  .cta{width:100%;min-height:54px;border:0;border-radius:999px;font-family:var(--font-heading);font-size:17px;background:var(--color-accent);color:var(--color-bg)}
  .err{color:#a8382a;font-size:12.5px;text-align:center;margin:10px 0 0}

  /* ── Turno / mesa ── */
  .turno-wrap{flex:1;display:flex;flex-direction:column;padding:26px 22px;justify-content:center}
  .turno-wrap h2{font-size:24px;text-align:center;margin-bottom:4px}
  .turno-sub{text-align:center;color:var(--color-neutral-600);font-size:13px;margin-bottom:20px}
  .mesas{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
  .mesa-btn{min-height:46px;border-radius:16px;font-size:14px;font-weight:600;border:1px solid var(--color-divider);background:var(--color-neutral-100);color:var(--color-text)}
  .mesa-btn.on{border-color:var(--color-accent);background:var(--color-accent);color:var(--color-bg)}

  /* ── Top bar ── */
  .topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb, var(--color-bg) 90%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--color-divider);padding:12px 18px;display:flex;align-items:center;gap:10px}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--color-accent-300);color:var(--color-accent-700);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
  .who{line-height:1.2}
  .who b{font-size:13.5px;display:block}
  .who span{font-size:11.5px;color:var(--color-neutral-600)}
  .logout{margin-left:auto;border:1px solid var(--color-divider);background:var(--color-neutral-100);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--color-neutral-700)}

  .tabs{display:flex;gap:6px;padding:12px 18px 0}
  .tab{flex:1;min-height:44px;border-radius:999px;border:1px solid var(--color-divider);background:transparent;color:var(--color-neutral-700);font-size:13.5px;font-weight:600}
  .tab.on{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-bg)}

  main{flex:1;padding:14px 18px 110px}

  /* ── Menú ── */
  .cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px}
  .cats::-webkit-scrollbar{display:none}
  .cat-pill{white-space:nowrap;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--color-divider);background:transparent;color:var(--color-neutral-700);font-size:13px;font-weight:600}
  .cat-pill.on{border-color:var(--color-accent);background:var(--color-accent);color:var(--color-bg)}
  .plato{display:flex;align-items:center;gap:12px;border-radius:24px;padding:14px 14px 14px 17px;margin-bottom:10px;border:1px solid var(--color-divider);background:var(--color-neutral-100)}
  .plato.in{border-color:var(--color-accent-300);background:var(--color-accent-100)}
  .plato-info{flex:1;min-width:0}
  .plato-info b{font-size:14.5px;display:block}
  .plato-info small{color:var(--color-neutral-600);font-size:12px;display:block;margin:2px 0 5px}
  .plato-info .precio{font-weight:700;font-size:13.5px;color:var(--color-accent-700)}
  .stepper{display:flex;align-items:center;gap:9px;flex:none}
  .stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--color-divider);background:var(--color-bg);font-size:16px;font-weight:700;line-height:1}
  .stepper button.add{border-color:var(--color-accent);background:var(--color-accent);color:var(--color-bg)}
  .stepper .qty{min-width:16px;text-align:center;font-weight:800}

  .cart-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;width:calc(100% - 36px);max-width:484px;background:var(--color-accent);color:var(--color-bg);border-radius:999px;padding:13px 20px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg);z-index:15;border:0}
  .cart-bar b{font-family:var(--font-heading);font-weight:400;font-size:14px}
  .cart-bar span{font-size:12px;opacity:.9}
  .cart-bar .cta-mini{margin-left:auto;background:var(--color-bg);color:var(--color-accent-700);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:700}

  /* ── Comanda drawer ── */
  .backdrop{position:fixed;inset:0;background:rgba(32,30,29,.42);z-index:30;display:none}
  .backdrop.show{display:block}
  .drawer{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--color-bg);border-radius:26px 26px 0 0;max-height:86dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s ease;box-shadow:var(--shadow-lg)}
  .drawer.show{transform:translateY(0)}
  .drawer-head{padding:16px 20px 10px;border-bottom:1px solid var(--color-divider);display:flex;align-items:center}
  .drawer-head h3{font-size:19px}
  .drawer-close{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--color-divider);background:var(--color-neutral-100)}
  .drawer-body{overflow-y:auto;padding:14px 20px}
  .linea-row{padding:12px 0;border-bottom:1px solid var(--color-divider)}
  .linea-top{display:flex;align-items:center;gap:10px}
  .linea-top b{flex:1;font-size:14px}
  .linea-top .sub{font-weight:700;font-size:13px;color:var(--color-accent-700)}
  .nota-input{width:100%;box-sizing:border-box;border:1px solid var(--color-divider);background:var(--color-neutral-100);border-radius:12px;padding:8px 12px;font-size:12.5px;margin-top:8px}
  .sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .sug button{border-radius:999px;padding:6px 12px;font-size:11.5px;cursor:pointer;border:1px solid var(--color-neutral-300);background:transparent;color:var(--color-neutral-700)}
  .sug button.on{border-color:var(--color-accent-2-600);background:var(--color-accent-2-600);color:var(--color-bg)}
  .drawer-foot{padding:14px 20px 20px;border-top:1px solid var(--color-divider);display:flex;flex-direction:column;gap:10px}
  .drawer-total{display:flex;justify-content:space-between;font-size:15px;font-weight:700}
  .drawer-actions{display:flex;gap:10px}
  .btn-ghost{flex:1;min-height:50px;border-radius:999px;border:1px solid var(--color-divider);background:transparent;color:var(--color-neutral-700);font-weight:600;font-size:14px}
  .btn-send{flex:2;min-height:50px;border-radius:999px;border:0;background:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);font-size:15.5px}

  /* ── Pedidos ── */
  .pedido-card{background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:26px;padding:17px 18px;box-shadow:var(--shadow-sm);margin-bottom:14px}
  .pedido-card.listo{border-color:var(--color-accent-2-500)}
  .p-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
  .p-mesa{font-family:var(--font-heading);font-size:17px}
  .p-badge{border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;white-space:nowrap;color:var(--color-bg)}
  .p-meta{font-size:11.5px;color:var(--color-neutral-600);margin-bottom:12px}
  .pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px}
  .paso-bar{height:6px;border-radius:999px;margin-bottom:4px}
  .paso-label{font-size:9px;letter-spacing:.04em;text-transform:uppercase;text-align:center}
  .p-lineas{border-top:1px dashed var(--color-divider);padding-top:10px;margin-bottom:10px}
  .p-linea{display:flex;gap:8px;font-size:13px;padding:3px 0;justify-content:space-between}
  .p-linea .desc{flex:1}
  .p-linea .nota{display:block;font-size:11px;color:var(--color-accent-700)}
  .p-total{display:flex;justify-content:space-between;font-weight:700;font-size:14px;border-top:1px solid var(--color-divider);padding-top:10px}
  .btn-servir{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:999px;background:var(--color-accent-2-600);color:var(--color-bg);font-family:var(--font-heading);font-size:15px}
  .empty-state{text-align:center;padding:60px 20px;color:var(--color-neutral-500)}
  .empty-state svg{width:48px;height:48px;opacity:.5;margin-bottom:10px}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--color-neutral-900);color:var(--color-bg);padding:12px 20px;border-radius:999px;font-size:13px;z-index:40;box-shadow:var(--shadow-lg);animation:rzToast 2.6s ease forwards;white-space:nowrap}

  .connbar{font-size:11px;text-align:center;color:var(--color-neutral-500);padding:6px 0 0}
  .listos-banner{display:block;width:calc(100% - 36px);margin:10px 18px 0;border:1px solid var(--color-accent-2-500);background:var(--color-accent-2-100);color:var(--color-accent-2-700);border-radius:16px;padding:12px 16px;font-size:13px;font-weight:700;text-align:left;animation:rzPulse 1.8s ease-in-out infinite}
</style>
</head>

/* ── Firebase Realtime Database — REST + SSE, sin SDK ni apiKey ──
   DB_URL / dbUrl / dbGet / dbPush / dbUpdate / escucharSSE /
   aplicarEventoSSE / siguienteCodigo vienen de ../shared/firebase.js
   Nota: hashPin/crearCuentaSiLibre se quedan aquí (no en shared/) a
   propósito — son parte del login por PIN que la Fase 1 del proyecto
   va a reemplazar por Firebase Authentication real. No tiene sentido
   reubicar código que está a punto de borrarse. ── */

// El PIN nunca se guarda ni se envía en texto plano — se hashea en el
// propio celular con SHA-256 antes de tocar la red.
async function hashPin(pin) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pin));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

// Crea la cuenta del mesero en /meseros/{usuario} solo si nadie se le
// adelantó — usa el mismo truco de ETag que el contador de códigos, para
// que dos registros simultáneos con el mismo usuario no se pisen.
async function crearCuentaSiLibre(usuario, datos) {
  const path = `/meseros/${usuario}`;
  const getRes = await fetch(dbUrl(path), { headers: { "X-Firebase-ETag": "true" } });
  const etag = getRes.headers.get("ETag");
  const existente = await getRes.json();
  if (existente) return false;
  const putRes = await fetch(dbUrl(path), {
    method: "PUT",
    headers: etag ? { "if-match": etag } : {},
    body: JSON.stringify(datos)
  });
  return putRes.status === 200;
}

/* ── Sesión y "recordados" — SOLO datos locales al dispositivo.
   Las cuentas (usuario + PIN hasheado) viven en Firebase en /meseros;
   este celular únicamente recuerda con qué usuarios YA se inició sesión
   aquí, para mostrarlos como accesos rápidos — nunca la lista completa
   de meseros del restaurante, así nadie ve ni toca el perfil de otro. ── */
const KEY_RECORDADOS = "rodizio_dispositivo_v1";
const KEY_SESION = "rodizio_sesion_v1";
const leerJSON = (k, def) => { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch (e) { return def; } };
const escribirJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
// escapeHtml viene de ../shared/util.js. "cop" es solo un alias local
// hacia fmtCop (mismo shared/util.js) para no tocar los usos de cop(...)
// repartidos por el resto de este archivo.
const cop = fmtCop;

function leerRecordados() { return leerJSON(KEY_RECORDADOS, []); }
function recordarEnDispositivo(usuario, nombre) {
  let lista = leerRecordados().filter(c => c.usuario !== usuario);
  lista.unshift({ usuario, nombre });
  escribirJSON(KEY_RECORDADOS, lista.slice(0, 5));
}

/* ── Escucha en vivo de /pedidos (solo los del mesero en turno se muestran) ── */
let primeraCargaPedidos = true;
let prevEstados = {}; // id -> estado, para detectar cuándo un pedido pasa a "listo"

function conectarPedidos() {
  const es = escucharSSE("/pedidos", (tipo, evento) => {
    state.pedidos = aplicarEventoSSE(state.pedidos, tipo, evento);
    detectarPedidosListos();
    setState({ conectado: true });
  });
  es.onopen = () => setState({ conectado: true });
  es.onerror = () => setState({ conectado: false });
}

// Avisa (sonido + notificación del sistema) apenas un pedido del mesero
// actual pasa a "listo" — sin importar en qué mesa o pestaña esté parado,
// así no tiene que ir hasta la otra mesa a comprobar.
function detectarPedidosListos() {
  Object.entries(state.pedidos).forEach(([id, p]) => {
    if (!p || p.mesero !== state.mesero) { prevEstados[id] = p ? p.estado : undefined; return; }
    const antes = prevEstados[id];
    if (p.estado === "listo" && antes !== "listo" && !primeraCargaPedidos) {
      avisarListo(p);
    }
    prevEstados[id] = p.estado;
  });
  primeraCargaPedidos = false;
}

function pedirPermisoNotificaciones() {
  if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission().catch(() => {});
  }
}

// Tono propio de "pedido listo" (distinto al de aviso de cocina/caja),
// generado con la fábrica compartida crearBeep() de ../shared/util.js.
const beepListo = crearBeep([740, 1040]);

function avisarListo(p) {
  beepListo();
  aviso("🔔 Mesa " + p.mesa + " lista · " + (p.codigo || ""));
  if ("Notification" in window && Notification.permission === "granted") {
    try {
      new Notification("Mesa " + p.mesa + " lista para servir", {
        body: (p.codigo || "Pedido") + " · toca para ver el detalle",
        icon: "icon-192.png",
        tag: "rodizio-listo"
      });
    } catch (e) {}
  }
}

/* ── Auth — las cuentas viven en Firebase (/meseros/{usuario}); el PIN
   viaja siempre hasheado, nunca en texto plano. ── */
function usuarioValido(u) { return /^[a-z0-9_-]{3,20}$/.test(u); }

async function registrar() {
  const nombre = state.fNombre.trim();
  const usuario = state.fUsuario.trim().toLowerCase();
  if (nombre.length < 3) return setState({ authError: "Escribe tu nombre completo." });
  if (!usuarioValido(usuario)) return setState({ authError: "Usuario: 3–20 caracteres, solo letras, números, \"_\" o \"-\"." });
  if (!/^\d{4}$/.test(state.fPin)) return setState({ authError: "El PIN debe ser de 4 dígitos." });
  if (state.fPin !== state.fPin2) return setState({ authError: "Los PIN no coinciden." });
  setState({ authCargando: true, authError: "" });
  try {
    const pinHash = await hashPin(state.fPin);
    const creada = await crearCuentaSiLibre(usuario, { nombre, pinHash, creado: Date.now() });
    if (!creada) { setState({ authCargando: false, authError: "Ese usuario ya está registrado." }); return; }
    // No inicia sesión automáticamente — vuelve a la pestaña de login para
    // que el mesero entre con su usuario y PIN recién creados. Sí lo deja
    // como acceso rápido en este celular para que se vea que quedó creado.
    recordarEnDispositivo(usuario, nombre);
    setState({
      recordados: leerRecordados(), authCargando: false, authModo: "login", authError: "",
      fUsuario: usuario, fNombre: "", fPin: "", fPin2: ""
    });
    aviso("Cuenta creada · Ahora inicia sesión, " + nombre.split(" ")[0]);
  } catch (e) {
    setState({ authCargando: false, authError: "No se pudo crear la cuenta — revisa tu conexión." });
  }
}

async function ingresar() {
  const usuario = state.fUsuario.trim().toLowerCase();
  if (!usuario) return setState({ authError: "Escribe tu usuario." });
  if (!/^\d{4}$/.test(state.fPin)) return setState({ authError: "El PIN debe ser de 4 dígitos." });
  setState({ authCargando: true, authError: "" });
  try {
    const cuenta = await dbGet(`/meseros/${usuario}`);
    if (!cuenta) { setState({ authCargando: false, authError: "No encontramos ese usuario. ¿Quieres registrarte?" }); return; }
    const pinHash = await hashPin(state.fPin);
    if (pinHash !== cuenta.pinHash) { setState({ authCargando: false, authError: "PIN incorrecto." }); return; }
    entrar(usuario, cuenta.nombre);
    aviso("Hola de nuevo, " + cuenta.nombre.split(" ")[0]);
  } catch (e) {
    setState({ authCargando: false, authError: "No se pudo verificar — revisa tu conexión." });
  }
}
function entrar(usuario, nombre) {
  const sesion = { usuario, nombre };
  escribirJSON(KEY_SESION, sesion);
  recordarEnDispositivo(usuario, nombre);
  setState({
    recordados: leerRecordados(), sesion, mesero: nombre, authError: "", authCargando: false,
    fNombre: "", fUsuario: "", fPin: "", fPin2: "", turnoAbierto: true, mesaBorrador: null
  });
}
function cerrarSesion() {
  try { localStorage.removeItem(KEY_SESION); } catch (e) {}
  setState({ sesion: null, mesero: "", mesa: null, carrito: [], comandaAbierta: false, turnoAbierto: false, tab: "menu", authModo: "login", authError: "", fPin: "", fPin2: "" });
}

/* ── Carrito ── */
function cambiar(id, delta) {
  const carrito = state.carrito.slice();
  const i = carrito.findIndex(l => l.id === id);
  if (i === -1) { if (delta > 0) carrito.push({ id, qty: 1, nota: "" }); }
  else { const q = carrito[i].qty + delta; if (q <= 0) carrito.splice(i, 1); else carrito[i] = Object.assign({}, carrito[i], { qty: q }); }
  setState({ carrito });
}
function setNota(id, nota) { setState({ carrito: state.carrito.map(l => l.id === id ? Object.assign({}, l, { nota }) : l) }); }
function total() { return state.carrito.reduce((s, l) => s + ITEM_INDEX[l.id].precio * l.qty, 0); }

/* ── Enviar comanda a Firebase ── */
async function enviar() {
  const btn = document.getElementById("btnEnviar");
  if (btn) { btn.disabled = true; btn.textContent = "Enviando…"; }
  const lineas = state.carrito.map(l => ({
    id: l.id, nombre: ITEM_INDEX[l.id].nombre, cat: ITEM_INDEX[l.id].cat,
    qty: l.qty, precio: ITEM_INDEX[l.id].precio, nota: (l.nota || "").trim()
  }));
  const codigo = await siguienteCodigo();
  const pedido = {
    codigo, mesa: state.mesa, mesero: state.mesero,
    meseroUsuario: state.sesion ? state.sesion.usuario : "",
    lineas, total: lineas.reduce((s, l) => s + l.precio * l.qty, 0),
    estado: "enviado", ts: Date.now()
  };
  try {
    await dbPush("/pedidos", pedido);
    setState({ carrito: [], comandaAbierta: false, tab: "pedidos" });
    aviso("Comanda " + codigo + " enviada a cocina · Mesa " + state.mesa);
  } catch (e) {
    aviso("No se pudo enviar — revisa la conexión");
  }
  if (btn) { btn.disabled = false; btn.textContent = "Enviar a cocina"; }
}
function marcarServido(id) { dbUpdate(`/pedidos/${id}`, { estado: "entregado", tsCambio: Date.now() }); }

/* ═══════════ RENDER ═══════════ */
function render() {
  const el = document.getElementById("app");
  if (!state.sesion) { el.innerHTML = renderAuth(); bindAuth(); return; }
  if (state.turnoAbierto) { el.innerHTML = renderTurno(); bindTurno(); return; }
  el.innerHTML = renderApp();
  bindApp();
  if (state.toast) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = state.toast;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }
}

function renderAuth() {
  const esReg = state.authModo === "registro";
  return `
  <div class="auth-wrap">
    <div class="auth-logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20 L20 4" stroke="#f5ead8" stroke-width="2.4" stroke-linecap="round"/><circle cx="7.3" cy="16.7" r="3" fill="#f5ead8"/><circle cx="12" cy="12" r="3" fill="#f5ead8"/><circle cx="16.7" cy="7.3" r="3" fill="#f5ead8"/></svg></div>
    <h1 class="auth-title">Rodizio</h1>
    <p class="auth-sub">Toma de pedidos para meseros</p>
    <div class="seg">
      <button id="tabLogin" class="${!esReg ? "on" : ""}">Entrar</button>
      <button id="tabReg" class="${esReg ? "on" : ""}">Crear cuenta</button>
    </div>
    ${esReg ? `
      <div class="field"><input id="fNombre" placeholder="Nombre completo" value="${escapeHtml(state.fNombre)}"></div>
      <div class="field"><input id="fUsuario" placeholder="Usuario" value="${escapeHtml(state.fUsuario)}"></div>
      <div class="field"><input id="fPin" placeholder="PIN de 4 dígitos" inputmode="numeric" value="${escapeHtml(state.fPin)}"></div>
      <div class="field"><input id="fPin2" placeholder="Confirma tu PIN" inputmode="numeric" value="${escapeHtml(state.fPin2)}"></div>
    ` : `
      ${state.recordados.length ? `<div class="chips">${state.recordados.map(c => `<button class="chip" data-user="${escapeHtml(c.usuario)}"><span class="av">${escapeHtml((c.nombre || "?").charAt(0).toUpperCase())}</span>@${escapeHtml(c.usuario)}</button>`).join("")}</div>` : ""}
      <div class="field"><input id="fUsuario" placeholder="Usuario" value="${escapeHtml(state.fUsuario)}"></div>
      <div class="field"><input id="fPin" placeholder="PIN de 4 dígitos" inputmode="numeric" value="${escapeHtml(state.fPin)}"></div>
    `}
    <button class="cta" id="btnAuth" ${state.authCargando ? "disabled" : ""}>${state.authCargando ? "Verificando…" : (esReg ? "Crear cuenta" : "Entrar")}</button>
    ${state.authError ? `<p class="err">${escapeHtml(state.authError)}</p>` : ""}
  </div>`;
}
function bindAuth() {
  document.getElementById("tabLogin").onclick = () => setState({ authModo: "login", authError: "" });
  document.getElementById("tabReg").onclick = () => setState({ authModo: "registro", authError: "" });
  // Los campos de texto NO disparan render() en cada tecla — reconstruir el
  // DOM mientras el usuario escribe le quita el foco y esconde el teclado
  // en móvil. En vez de eso, mutamos el estado en silencio y dejamos que el
  // propio <input> siga mostrando lo que el usuario tecleó.
  const limpiarError = () => { state.authError = ""; const e = document.querySelector(".err"); if (e) e.remove(); };
  const fu = document.getElementById("fUsuario"); if (fu) fu.oninput = e => { state.fUsuario = e.target.value; limpiarError(); };
  const fp = document.getElementById("fPin"); if (fp) fp.oninput = e => { const v = e.target.value.replace(/\D/g, "").slice(0, 4); e.target.value = v; state.fPin = v; limpiarError(); };
  const fp2 = document.getElementById("fPin2"); if (fp2) fp2.oninput = e => { const v = e.target.value.replace(/\D/g, "").slice(0, 4); e.target.value = v; state.fPin2 = v; limpiarError(); };
  const fn = document.getElementById("fNombre"); if (fn) fn.oninput = e => { state.fNombre = e.target.value; limpiarError(); };
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => setState({ fUsuario: c.dataset.user, authError: "" }));
  document.getElementById("btnAuth").onclick = () => state.authModo === "registro" ? registrar() : ingresar();
}

function renderTurno() {
  const mesas = Array.from({ length: 20 }, (_, i) => i + 1);
  return `
  <div class="turno-wrap">
    <h2>${escapeHtml(state.mesero.split(" ")[0] || "Mesero")}, elige tu mesa</h2>
    <p class="turno-sub">Puedes cambiarla en cualquier momento desde tu turno</p>
    <div class="mesas">${mesas.map(n => `<button class="mesa-btn ${n === state.mesaBorrador ? "on" : ""}" data-n="${n}">${n}</button>`).join("")}</div>
    <button class="cta" id="btnConfirmarMesa" style="margin-top:22px;${state.mesaBorrador ? "" : "opacity:.45;cursor:not-allowed"}">Comenzar turno</button>
  </div>`;
}
function bindTurno() {
  document.querySelectorAll(".mesa-btn").forEach(b => b.onclick = () => setState({ mesaBorrador: Number(b.dataset.n) }));
  document.getElementById("btnConfirmarMesa").onclick = () => {
    if (!state.mesaBorrador) return;
    pedirPermisoNotificaciones();
    setState({ mesa: state.mesaBorrador, turnoAbierto: false });
  };
}

function renderApp() {
  const activos = Object.values(state.pedidos).filter(p => p.mesero === state.mesero && p.estado !== "entregado");
  const listos = Object.values(state.pedidos).filter(p => p.mesero === state.mesero && p.estado === "listo");
  return `
  <div class="topbar">
    <div class="avatar">${escapeHtml((state.mesero || "?").trim().charAt(0).toUpperCase())}</div>
    <div class="who"><b>${escapeHtml(state.mesero)}</b><span>Mesa ${state.mesa} · @${escapeHtml(state.sesion.usuario)}</span></div>
    <button class="logout" id="btnMesa">Cambiar mesa</button>
    <button class="logout" id="btnLogout">Salir</button>
  </div>
  <div class="tabs">
    <button class="tab ${state.tab === "menu" ? "on" : ""}" id="tabMenu">Menú</button>
    <button class="tab ${state.tab === "pedidos" ? "on" : ""}" id="tabPedidos">Pedidos ${activos.length ? "· " + activos.length : ""}</button>
  </div>
  <p class="connbar">${state.conectado ? "● Conectado con cocina" : "○ Conectando con cocina…"}</p>
  ${listos.length ? `<button class="listos-banner" id="btnVerListos">🔔 ${listos.length === 1 ? "1 pedido listo" : listos.length + " pedidos listos"} · ${listos.map(p => "Mesa " + p.mesa).join(", ")} — toca para ver</button>` : ""}
  <main>${state.tab === "menu" ? renderMenu() : renderPedidos()}</main>
  ${state.tab === "menu" && state.carrito.length && !state.comandaAbierta ? renderCartBar() : ""}
  ${renderDrawer()}
  `;
}
function renderMenu() {
  const grupo = MENU.find(g => g.cat === state.cat) || MENU[0];
  const enCarrito = {}; state.carrito.forEach(l => enCarrito[l.id] = l.qty);
  return `
  <div class="cats">${CATS.map(c => `<button class="cat-pill ${c === state.cat ? "on" : ""}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("")}</div>
  ${grupo.items.map(it => {
    const q = enCarrito[it.id] || 0;
    return `<div class="plato ${q > 0 ? "in" : ""}">
      <div class="plato-info"><b>${escapeHtml(it.nombre)}</b><small>${escapeHtml(it.desc)}</small><span class="precio">${cop(it.precio)}</span></div>
      <div class="stepper">
        ${q > 0 ? `<button data-quitar="${it.id}">–</button><span class="qty">${q}</span>` : ""}
        <button class="add" data-agregar="${it.id}">+</button>
      </div>
    </div>`;
  }).join("")}`;
}
function renderCartBar() {
  const unidades = state.carrito.reduce((n, l) => n + l.qty, 0);
  return `<button class="cart-bar" id="btnAbrirComanda"><b>${unidades} ítem${unidades === 1 ? "" : "s"}</b><span>${cop(total())}</span><span class="cta-mini">Ver comanda</span></button>`;
}
function renderDrawer() {
  const abierta = state.comandaAbierta;
  const lineas = state.carrito.map(l => {
    const it = ITEM_INDEX[l.id];
    const sug = SUGERENCIAS[it.cat] || [];
    return `<div class="linea-row">
      <div class="linea-top">
        <b>${escapeHtml(it.nombre)}</b>
        <div class="stepper"><button data-quitar="${it.id}">–</button><span class="qty">${l.qty}</span><button class="add" data-agregar="${it.id}">+</button></div>
        <span class="sub">${cop(it.precio * l.qty)}</span>
      </div>
      ${sug.length ? `<div class="sug">${sug.map(t => `<button class="${(l.nota || "").trim() === t ? "on" : ""}" data-nota-chip="${it.id}" data-texto="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join("")}</div>` : ""}
      <input class="nota-input" placeholder="Nota para cocina (opcional)" data-nota="${it.id}" value="${escapeHtml(l.nota || "")}">
    </div>`;
  }).join("") || `<p style="text-align:center;color:var(--color-neutral-500);padding:30px 0">Tu comanda está vacía</p>`;
  return `
  <div class="backdrop ${abierta ? "show" : ""}" id="backdrop"></div>
  <div class="drawer ${abierta ? "show" : ""}">
    <div class="drawer-head"><h3>Comanda · Mesa ${state.mesa}</h3><button class="drawer-close" id="btnCerrarDrawer">✕</button></div>
    <div class="drawer-body">${lineas}</div>
    <div class="drawer-foot">
      <div class="drawer-total"><span>Total</span><span>${cop(total())}</span></div>
      <div class="drawer-actions">
        <button class="btn-ghost" id="btnVaciar">Vaciar</button>
        <button class="btn-send" id="btnEnviar" ${state.carrito.length ? "" : "disabled"}>Enviar a cocina</button>
      </div>
    </div>
  </div>`;
}
function renderPedidos() {
  const mios = Object.entries(state.pedidos).filter(([, p]) => p.mesero === state.mesero).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
  if (!mios.length) {
    return `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg><p>Aún no has enviado comandas en este turno</p></div>`;
  }
  return mios.map(([id, p]) => {
    const idx = ESTADOS.indexOf(p.estado);
    const min = Math.max(0, Math.round((Date.now() - p.ts) / 60000));
    const color = p.estado === "listo" ? "var(--color-accent-2-600)" : p.estado === "entregado" ? "var(--color-neutral-500)" : "var(--color-accent)";
    const pasos = ["Enviado", "En preparación", "Listo", "Servido"];
    return `<div class="pedido-card ${p.estado === "listo" ? "listo" : ""}">
      <div class="p-top"><span class="p-mesa">Mesa ${escapeHtml(String(p.mesa))}</span><span class="p-badge" style="background:${color}">${escapeHtml(ETIQUETA[p.estado] || p.estado)}</span></div>
      <p class="p-meta">${escapeHtml(p.codigo || id)} · hace ${min} min · ${(p.lineas || []).reduce((n, l) => n + l.qty, 0)} ítems</p>
      <div class="pasos">${pasos.map((nombre, i) => `<div><div class="paso-bar" style="background:${i <= idx ? color : "var(--color-neutral-300)"}"></div><div class="paso-label" style="color:${i <= idx ? "var(--color-neutral-800)" : "var(--color-neutral-500)"}">${nombre}</div></div>`).join("")}</div>
      <div class="p-lineas">${(p.lineas || []).map(l => `<div class="p-linea"><span class="desc">${l.qty}× ${escapeHtml(l.nombre)}${l.nota ? `<span class="nota">${escapeHtml(l.nota)}</span>` : ""}</span><span>${cop(l.precio * l.qty)}</span></div>`).join("")}</div>
      <div class="p-total"><span>Total</span><span>${cop(p.total)}</span></div>
      ${p.estado === "listo" ? `<button class="btn-servir" data-servir="${id}">Marcar servido</button>` : ""}
    </div>`;
  }).join("");
}

function bindApp() {
  document.getElementById("btnLogout").onclick = cerrarSesion;
  document.getElementById("btnMesa").onclick = () => setState({ turnoAbierto: true, mesaBorrador: state.mesa });
  document.getElementById("tabMenu").onclick = () => setState({ tab: "menu" });
  document.getElementById("tabPedidos").onclick = () => setState({ tab: "pedidos" });
  const btnVerListos = document.getElementById("btnVerListos"); if (btnVerListos) btnVerListos.onclick = () => setState({ tab: "pedidos" });

  document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => setState({ cat: b.dataset.cat }));
  document.querySelectorAll("[data-agregar]").forEach(b => b.onclick = () => cambiar(b.dataset.agregar, 1));
  document.querySelectorAll("[data-quitar]").forEach(b => b.onclick = () => cambiar(b.dataset.quitar, -1));

  const abrir = document.getElementById("btnAbrirComanda"); if (abrir) abrir.onclick = () => setState({ comandaAbierta: true });
  const backdrop = document.getElementById("backdrop"); if (backdrop) backdrop.onclick = () => setState({ comandaAbierta: false });
  const cerrarD = document.getElementById("btnCerrarDrawer"); if (cerrarD) cerrarD.onclick = () => setState({ comandaAbierta: false });
  const vaciar = document.getElementById("btnVaciar"); if (vaciar) vaciar.onclick = () => setState({ carrito: [], comandaAbierta: false });
  const btnEnviar = document.getElementById("btnEnviar"); if (btnEnviar) btnEnviar.onclick = enviar;

  // Igual que en los campos de auth: la nota se escribe sin re-renderizar
  // en cada tecla, para no perder el foco del teclado en móvil.
  document.querySelectorAll("[data-nota]").forEach(inp => inp.oninput = e => {
    const linea = state.carrito.find(l => l.id === inp.dataset.nota);
    if (linea) linea.nota = e.target.value;
  });
  document.querySelectorAll("[data-nota-chip]").forEach(b => b.onclick = () => {
    const actual = (state.carrito.find(l => l.id === b.dataset.notaChip) || {}).nota || "";
    setNota(b.dataset.notaChip, actual.trim() === b.dataset.texto ? "" : b.dataset.texto);
  });
  document.querySelectorAll("[data-servir]").forEach(b => b.onclick = () => marcarServido(b.dataset.servir));
}

render();
conectarPedidos();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
