<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#b10101">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rodizio Caja">
<title>Rodizio · Panel de caja</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icons/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="../icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="vistaCargando" class="cargando cargando-wrap">
  <div class="cargando-logo"><img src="../icons/icon-192.png" alt="Rodizio"></div>
  <div class="spinner"></div>
  <p class="cargando-texto">Verificando sesión…</p>
</div>

<div id="app" style="display:none">
<header>
  <div class="headwrap">
    <div class="brand">
      <div class="brand-badge">
        <img src="../icons/icon-192.png" alt="Rodizio">
      </div>
      <div>
        <h1>Rodizio</h1>
        <small>Panel de caja</small>
      </div>
    </div>
    <div class="status"><span class="dot off" id="dot"></span><span id="statusTxt">Conectando…</span></div>
    <div class="clock" id="clock">--:--</div>
    <button class="sound-btn" id="soundBtn" data-on="1" title="Silenciar aviso de nuevo pedido">
      <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button class="btn-instalar-pwa" id="btnInstalarApp"><svg class="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Instalar App</button>
    <button class="logout" id="btnLogout">Salir</button>
  </div>
</header>

<main>
  <div class="banner" id="banner">Sin conexión con Firebase — mostrando la última comanda recibida.</div>

  <section>
    <div class="col-head"><span class="swatch" style="background:var(--color-accent)"></span><h2>Por cobrar</h2><span class="col-count" id="cPorCobrar">0</span></div>
    <div class="cards" id="colPorCobrar"></div>
  </section>
</main>

<section class="entregados-sec">
  <div class="entregados-head">
    <span class="swatch"></span><h2>Cobrados hoy</h2><span class="col-count" id="cCobrados">0</span>
    <button class="btn-exportar" id="btnExportar" title="Descargar en Excel"><svg class="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Exportar Excel</button>
  </div>
  <div class="entregados-list" id="entregadosList"></div>
</section>

<div class="footbar">
  <div class="stat"><b id="statHoy">0</b>comandas hoy</div>
  <div class="stat"><b id="statCobradas">0</b>cobradas hoy</div>
  <div class="stat"><b id="statPorCobrar">0</b>por cobrar</div>
</div>
</div>

<script src="../shared/firebase.js"></script>
<script src="../shared/util.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/roles.js"></script>
<script type="module" src="../shared/auth.js"></script>
<script src="app.js"></script>
</body>
</html>
