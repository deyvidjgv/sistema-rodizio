<!DOCTYPE html>
<html lang="es-CO">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#c67139">
  <title>Rodizio · Acceso</title>
  <link rel="icon" type="image/png" sizes="192x192" href="mesero-app/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="shared/theme.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="wrap" id="app">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none">
        <path d="M4 20 L20 4" stroke="#f5ead8" stroke-width="2.4" stroke-linecap="round" />
        <circle cx="7.3" cy="16.7" r="3" fill="#f5ead8" />
        <circle cx="12" cy="12" r="3" fill="#f5ead8" />
        <circle cx="16.7" cy="7.3" r="3" fill="#f5ead8" />
      </svg></div>
    <h1 class="title">Rodizio</h1>
    <p class="sub" id="subTxt">Cúcuta · Sistema interno</p>

    <div id="vistaCargando" class="cargando hidden">Verificando sesión…</div>

    <form id="formLogin">
      <div class="field"><input id="fUsuario" placeholder="Usuario" autocomplete="username"></div>
      <div class="field"><input id="fPassword" type="password" placeholder="Contraseña" autocomplete="current-password">
      </div>
      <button class="cta" id="btnEntrar" type="submit">Entrar</button>
      <p class="err hidden" id="errLogin"></p>
    </form>
    <button class="logout-link hidden" id="btnMostrarRegistro">Crear cuenta de administrador (bootstrap)</button>

    <!-- BOOTSTRAP TEMPORAL: crea el primer admin (Auth + /trabajadores) sin pasar por
         panel-admin, que requiere ya tener un admin para entrar. Oculto por defecto
         (clase "hidden" arriba) — app.js solo lo muestra si /trabajadores no tiene
         todavía ningún admin activo. IMPORTANTE: esto es una mitigación del lado del
         cliente nada más; la protección real tiene que venir de las reglas de Firebase
         RTDB (que /trabajadores solo se pueda escribir por un admin ya autenticado, o
         cuando la colección esté vacía). Quitar este bloque por completo (form +
         botones + handlers JS) una vez exista al menos un admin funcional y confiable. -->
    <form id="formRegistro" class="hidden">
      <div class="field"><input id="rNombre" placeholder="Nombre completo"></div>
      <div class="field"><input id="rUsuario" placeholder="Usuario (ej. juanp)" autocomplete="off"></div>
      <div class="field"><input id="rPassword" type="password" placeholder="Contraseña (mín. 6 caracteres)"
          autocomplete="new-password"></div>
      <button class="cta" id="btnRegistrar" type="submit">Crear administrador</button>
      <button class="logout-link" id="btnCancelarRegistro" type="button">Cancelar</button>
      <p class="err hidden" id="errRegistro"></p>
      <p class="ok hidden" id="okRegistro" style="color:var(--color-accent-2-700);font-size:12.5px;text-align:center;margin:12px 0 0"></p>
    </form>

    <div id="vistaRoles" class="hidden">
      <h2 class="roles-title" id="bienvenida">Bienvenido</h2>
      <p class="roles-sub">Selecciona con qué función vas a entrar</p>
      <div id="listaRoles"></div>
      <button class="logout-link" id="btnCancelar">Cancelar y salir</button>
    </div>
  </div>

  <script src="shared/firebase.js"></script>
  <script src="shared/util.js"></script>
  <script src="shared/roles.js"></script>
  <script type="module" src="shared/auth.js"></script>
  <script src="app.js"></script>
</body>

</html>
