<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#c67139">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rodizio Caja">
<title>Rodizio · Panel de caja</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js" defer></script>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  h1,h2,h3{font-family:var(--font-heading);font-weight:400;margin:0}
  @keyframes rzPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
  @keyframes rzPop{0%{opacity:0;transform:translateY(-8px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes rzRing{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--color-accent) 55%, transparent)}100%{box-shadow:0 0 0 14px transparent}}

  /* ————— Layout ————— */
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--color-bg) 88%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--color-divider)}
  .headwrap{max-width:1400px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .brand-badge{width:38px;height:38px;border-radius:12px;background:var(--color-accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);flex:none}
  .brand-badge svg{width:20px;height:20px}
  .brand h1{font-size:19px;line-height:1.1}
  .brand small{display:block;font-size:11px;color:var(--color-neutral-600);letter-spacing:.03em;text-transform:uppercase;margin-top:2px}
  .status{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--color-neutral-700);background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:999px;padding:7px 13px 7px 10px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent-2-500);flex:none}
  .dot.off{background:var(--color-neutral-500)}
  .dot.live{animation:rzPulse 1.8s ease-in-out infinite}
  .clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;color:var(--color-neutral-800);background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:999px;padding:7px 14px}
  .sound-btn{border:1px solid var(--color-divider);background:var(--color-neutral-100);border-radius:999px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-neutral-700)}
  .sound-btn[data-on="0"]{color:var(--color-neutral-400)}
  .sound-btn svg{width:18px;height:18px}

  main{max-width:1400px;margin:0 auto;padding:18px 20px 60px}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
  @media (max-width:980px){.board{grid-template-columns:1fr;gap:22px}}
  .col{min-width:0}
  .col-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:0 4px}
  .col-head .swatch{width:11px;height:11px;border-radius:4px;flex:none}
  .col-head h2{font-size:16px;flex:1}
  .col-count{font-family:var(--font-body);font-weight:800;font-size:13px;background:var(--color-neutral-200);color:var(--color-neutral-800);border-radius:999px;min-width:26px;height:22px;padding:0 8px;display:flex;align-items:center;justify-content:center}
  .cards{display:flex;flex-direction:column;gap:12px;min-height:70px}

  .ticket{background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:var(--radius-lg);padding:16px 17px;box-shadow:var(--shadow-sm);animation:rzPop .28s ease both}
  .ticket.enviado{border-color:var(--color-accent-300)}
  .ticket.listo{border-color:var(--color-accent-2-500);background:var(--color-accent-2-100)}
  .ticket.nueva{animation:rzPop .28s ease both, rzRing 1.1s ease-out 1}
  .t-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
  .t-codigo{font-family:var(--font-heading);font-size:21px;line-height:1}
  .t-mesa{display:inline-block;margin-top:5px;font-size:12px;font-weight:700;color:var(--color-bg);background:var(--color-neutral-800);border-radius:999px;padding:3px 10px}
  .t-time{font-size:12px;font-weight:700;color:var(--color-neutral-600);white-space:nowrap;text-align:right}
  .t-time.warn{color:var(--color-accent-700)}
  .t-mesero{font-size:12px;color:var(--color-neutral-600);margin:2px 0 10px}
  .t-lineas{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
  .t-linea{display:flex;gap:9px;font-size:13.5px;line-height:1.35}
  .t-qty{font-weight:800;color:var(--color-accent-700);min-width:24px}
  .t-nombre{flex:1}
  .t-nota{display:block;font-size:11.5px;color:var(--color-accent-700);background:var(--color-accent-100);border-radius:8px;padding:3px 8px;margin-top:3px;width:fit-content}
  .t-foot{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px dashed var(--color-divider)}
  .t-total{font-weight:800;font-size:14px}
  .t-action{margin-left:auto;border:0;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;color:var(--color-bg)}
  .t-action.a-prep{background:var(--color-accent)}
  .t-action.a-listo{background:var(--color-accent-2-600)}
  .t-badge-listo{margin-left:auto;font-size:12px;font-weight:800;color:var(--color-accent-2-700);display:flex;align-items:center;gap:6px}
  .t-badge-listo .b{width:7px;height:7px;border-radius:50%;background:var(--color-accent-2-600);animation:rzPulse 1.4s ease-in-out infinite}

  .empty{border:1.5px dashed var(--color-divider);border-radius:var(--radius-lg);padding:26px 16px;text-align:center;color:var(--color-neutral-500);font-size:13px}

  /* ————— Sección de entregados ————— */
  .entregados-sec{max-width:1400px;margin:26px auto 18px;padding:0 20px}
  .entregados-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:0 4px}
  .entregados-head .swatch{width:11px;height:11px;border-radius:4px;flex:none;background:var(--color-neutral-500)}
  .entregados-head h2{font-size:16px;flex:1}
  .btn-exportar{border:1px solid var(--color-accent-300);background:var(--color-accent-100);color:var(--color-accent-700);border-radius:999px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .btn-exportar:disabled{opacity:.5;cursor:wait}
  .entregados-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;border:1px solid var(--color-divider);border-radius:var(--radius-lg);background:var(--color-neutral-100);padding:8px}
  .entregado-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--color-bg)}
  .e-codigo{font-family:var(--font-heading);font-size:15px;min-width:64px}
  .e-mesa{font-size:11px;font-weight:700;color:var(--color-bg);background:var(--color-neutral-600);border-radius:999px;padding:3px 9px;flex:none}
  .e-mesero{flex:1;font-size:12.5px;color:var(--color-neutral-600);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .e-hora{font-size:11.5px;color:var(--color-neutral-500);white-space:nowrap}
  .e-total{font-weight:800;font-size:13px;white-space:nowrap}
  .entregados-empty{padding:22px 10px;text-align:center;color:var(--color-neutral-500);font-size:13px}

  .footbar{max-width:1400px;margin:0 auto;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:var(--color-neutral-100);border:1px solid var(--color-divider);border-radius:16px;padding:10px 15px;font-size:12.5px;color:var(--color-neutral-700)}
  .stat b{font-family:var(--font-heading);font-weight:400;font-size:16px;color:var(--color-text);margin-right:6px}

  .banner{max-width:1400px;margin:0 auto 14px;padding:11px 16px;border-radius:16px;background:var(--color-accent-100);border:1px solid var(--color-accent-300);color:var(--color-accent-700);font-size:12.5px;display:none;align-items:center;gap:8px}
  .banner.show{display:flex}

  .cargando{text-align:center;color:var(--color-neutral-600);padding:60px 20px}
  .logout{border:1px solid var(--color-divider);background:var(--color-neutral-100);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--color-neutral-700);cursor:pointer}
</style>
</head>
<body>

<div id="vistaCargando" class="cargando">Verificando sesión…</div>

<div id="app" style="display:none">
<header>
  <div class="headwrap">
    <div class="brand">
      <div class="brand-badge">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 20 L20 4" stroke="#f5ead8" stroke-width="2.4" stroke-linecap="round"/><circle cx="7.3" cy="16.7" r="3" fill="#f5ead8"/><circle cx="12" cy="12" r="3" fill="#f5ead8"/><circle cx="16.7" cy="7.3" r="3" fill="#f5ead8"/></svg>
      </div>
      <div>
        <h1>Rodizio</h1>
        <small>Panel de caja</small>
      </div>
    </div>
    <div class="status"><span class="dot off" id="dot"></span><span id="statusTxt">Conectando…</span></div>
    <div class="clock" id="clock">--:--</div>
    <button class="sound-btn" id="soundBtn" data-on="1" title="Silenciar aviso de nuevo pedido">
      <svg id="soundIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
    <button class="logout" id="btnLogout">Salir</button>
  </div>
</header>

<main>
  <div class="banner" id="banner">Sin conexión con Firebase — mostrando la última comanda recibida.</div>

  <div class="board">
    <section class="col">
      <div class="col-head"><span class="swatch" style="background:var(--color-accent)"></span><h2>Nuevos</h2><span class="col-count" id="cEnviado">0</span></div>
      <div class="cards" id="colEnviado"></div>
    </section>
    <section class="col">
      <div class="col-head"><span class="swatch" style="background:var(--color-accent-700)"></span><h2>En preparación</h2><span class="col-count" id="cPrep">0</span></div>
      <div class="cards" id="colPrep"></div>
    </section>
    <section class="col">
      <div class="col-head"><span class="swatch" style="background:var(--color-accent-2-600)"></span><h2>Listos</h2><span class="col-count" id="cListo">0</span></div>
      <div class="cards" id="colListo"></div>
    </section>
  </div>
</main>

<section class="entregados-sec">
  <div class="entregados-head">
    <span class="swatch"></span><h2>Entregados hoy</h2><span class="col-count" id="cEntregados">0</span>
    <button class="btn-exportar" id="btnExportar" title="Descargar en Excel">⬇️ Exportar Excel</button>
  </div>
  <div class="entregados-list" id="entregadosList"></div>
</section>

<div class="footbar">
  <div class="stat"><b id="statHoy">0</b>comandas hoy</div>
  <div class="stat"><b id="statEntregados">0</b>servidas</div>
  <div class="stat"><b id="statPromedio">0 min</b>tiempo medio en cocina</div>
</div>
</div>

<script src="../shared/firebase.js"></script>
<script src="../shared/util.js"></script>
<script src="../shared/roles.js"></script>
<script type="module" src="../shared/auth.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   Rodizio · Panel de caja — vanilla JS, sin build, un solo archivo.
   Conectado directamente a Firebase Realtime Database por REST + SSE
   (Server-Sent Events), así que no necesita apiKey ni el SDK de Firebase:
   solo la URL de la base de datos.
   Sesión: guard de Firebase Authentication + rol "cajero" (ver
   shared/auth.js y shared/roles.js) — el login ocurre en el login raíz
   (/index.html); este panel solo verifica y, si falla, redirige ahí.
   ───────────────────────────────────────────────────────────── */
// DB_URL / dbUrl / dbUpdate / escucharSSE / aplicarEventoSSE / escapeHtml /
// fmtCop / crearBeep vienen de ../shared/firebase.js y ../shared/util.js

let pedidos = {};      // { pushId: {codigo, mesa, mesero, lineas, total, estado, ts} }
let vistos = new Set(); // ids ya renderizados, para detectar "nuevos" y sonar aviso
let primeraCarga = true;
let sonidoOn = true;
const beep = crearBeep([880, 1180]);

function minsDesde(ts){ return Math.max(0, Math.round((Date.now() - ts) / 60000)); }

/* ── Server-Sent Events: escucha /pedidos en tiempo real ── */
function conectar() {
  const es = escucharSSE("/pedidos", (tipo, evento) => {
    pedidos = aplicarEventoSSE(pedidos, tipo, evento);
    setStatus(true);
    render();
  });
  es.onopen = () => setStatus(true);
  es.onerror = () => { setStatus(false); };
  return es;
}

function setStatus(ok) {
  document.getElementById("dot").className = "dot " + (ok ? "live" : "off");
  document.getElementById("statusTxt").textContent = ok ? "En vivo" : "Conectando…";
  document.getElementById("banner").classList.toggle("show", !ok);
}

document.getElementById("soundBtn").addEventListener("click", () => {
  sonidoOn = !sonidoOn;
  const btn = document.getElementById("soundBtn");
  btn.dataset.on = sonidoOn ? "1" : "0";
  document.getElementById("soundIcon").innerHTML = sonidoOn
    ? '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'
    : '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M23 9l-6 6"/><path d="M17 9l6 6"/>';
});

/* ── Acciones de cocina ── */
function marcar(id, estado) {
  dbUpdate(`/pedidos/${id}`, { estado, tsCambio: Date.now() });
}

/* ── Render ── */
function linea(l) {
  return `<div class="t-linea">
    <span class="t-qty">${l.qty}×</span>
    <span class="t-nombre">${escapeHtml(l.nombre)}${l.nota ? `<span class="t-nota">${escapeHtml(l.nota)}</span>` : ""}</span>
  </div>`;
}

function ticket(id, p, accion) {
  const min = minsDesde(p.ts);
  const nueva = !vistos.has(id) && !primeraCarga && p.estado === "enviado";
  const lineasHtml = (p.lineas || []).map(linea).join("");
  let foot = "";
  if (accion === "prep") foot = `<button class="t-action a-prep" onclick="marcar('${id}','preparacion')">Empezar</button>`;
  else if (accion === "listo") foot = `<button class="t-action a-listo" onclick="marcar('${id}','listo')">Marcar listo</button>`;
  else if (accion === "espera") foot = `<span class="t-badge-listo"><span class="b"></span>Esperando mesero</span>`;

  return `<div class="ticket ${p.estado}${nueva ? " nueva" : ""}" data-id="${id}">
    <div class="t-top">
      <div><div class="t-codigo">${escapeHtml(p.codigo || id)}</div><span class="t-mesa">Mesa ${escapeHtml(String(p.mesa ?? "—"))}</span></div>
      <div class="t-time ${min >= 15 ? "warn" : ""}">hace ${min} min</div>
    </div>
    <div class="t-mesero">${escapeHtml(p.mesero || "Mesero")}</div>
    <div class="t-lineas">${lineasHtml}</div>
    <div class="t-foot"><span class="t-total">${fmtCop(p.total)}</span>${foot}</div>
  </div>`;
}

function render() {
  const entries = Object.entries(pedidos).filter(([, p]) => p && p.estado);
  entries.sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));

  const enviados = entries.filter(([, p]) => p.estado === "enviado");
  const prep = entries.filter(([, p]) => p.estado === "preparacion");
  const listos = entries.filter(([, p]) => p.estado === "listo");
  const entregados = entries.filter(([, p]) => p.estado === "entregado");

  fill("colEnviado", "cEnviado", enviados, "prep");
  fill("colPrep", "cPrep", prep, "listo");
  fill("colListo", "cListo", listos, "espera");
  fillEntregados(entregados);

  document.getElementById("statHoy").textContent = entries.length;
  document.getElementById("statEntregados").textContent = entregados.length;

  const cerrados = entries.filter(([, p]) => p.tsCambio && p.estado !== "enviado");
  const promedio = cerrados.length
    ? Math.round(cerrados.reduce((s, [, p]) => s + (p.tsCambio - p.ts), 0) / cerrados.length / 60000)
    : 0;
  document.getElementById("statPromedio").textContent = promedio + " min";

  const nuevosSinVer = enviados.some(([id]) => !vistos.has(id));
  if (nuevosSinVer && !primeraCarga && sonidoOn) beep();

  entries.forEach(([id]) => vistos.add(id));
  primeraCarga = false;
}

/* ── Registro de entregados: solo los de hoy, más reciente primero ── */
function esHoy(ts) {
  if (!ts) return false;
  const a = new Date(ts), b = new Date();
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function entregadoRow(id, p) {
  const hora = new Date(p.tsCambio || p.ts).toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
  return `<div class="entregado-row" data-id="${id}">
    <span class="e-codigo">${escapeHtml(p.codigo || id)}</span>
    <span class="e-mesa">Mesa ${escapeHtml(String(p.mesa ?? "—"))}</span>
    <span class="e-mesero">${escapeHtml(p.mesero || "Mesero")}</span>
    <span class="e-hora">${hora}</span>
    <span class="e-total">${fmtCop(p.total)}</span>
  </div>`;
}
function fillEntregados(entregados) {
  const hoy = entregados.filter(([, p]) => esHoy(p.tsCambio || p.ts)).sort((a, b) => (b[1].tsCambio || b[1].ts || 0) - (a[1].tsCambio || a[1].ts || 0));
  document.getElementById("cEntregados").textContent = hoy.length;
  const list = document.getElementById("entregadosList");
  list.innerHTML = hoy.length
    ? hoy.map(([id, p]) => entregadoRow(id, p)).join("")
    : `<div class="entregados-empty">Aún no se ha entregado ningún pedido hoy</div>`;
}

function fill(colId, countId, list, accion) {
  const col = document.getElementById(colId);
  document.getElementById(countId).textContent = list.length;
  col.innerHTML = list.length
    ? list.map(([id, p]) => ticket(id, p, accion)).join("")
    : `<div class="empty">Sin comandas aquí por ahora</div>`;
}

/* ── Exportar a Excel — todos los pedidos entregados que este panel
   tiene cargados en memoria (historial completo recibido por streaming
   desde Firebase, no solo los de hoy), con formato legible: encabezado
   de color, columnas centradas, ancho cómodo y moneda formateada. ── */
async function exportarExcel() {
  const btn = document.getElementById("btnExportar");
  const entregados = Object.entries(pedidos)
    .filter(([, p]) => p && p.estado === "entregado")
    .sort((a, b) => (a[1].tsCambio || a[1].ts || 0) - (b[1].tsCambio || b[1].ts || 0));

  if (!entregados.length) { alert("Todavía no hay pedidos entregados para exportar."); return; }
  if (typeof ExcelJS === "undefined") { alert("No se pudo cargar el generador de Excel — revisa tu conexión e intenta de nuevo."); return; }

  btn.disabled = true; const textoOriginal = btn.textContent; btn.textContent = "Generando…";
  try {
    const wb = new ExcelJS.Workbook();
    wb.creator = "Rodizio";
    wb.created = new Date();
    const ws = wb.addWorksheet("Entregados", { views: [{ state: "frozen", ySplit: 1 }] });

    ws.columns = [
      { header: "Código", key: "codigo", width: 12 },
      { header: "Mesa", key: "mesa", width: 9 },
      { header: "Mesero", key: "mesero", width: 20 },
      { header: "Fecha", key: "fecha", width: 13 },
      { header: "Hora enviado", key: "horaEnviado", width: 14 },
      { header: "Hora entregado", key: "horaEntregado", width: 15 },
      { header: "Min. en cocina", key: "minCocina", width: 14 },
      { header: "Ítems", key: "items", width: 55 },
      { header: "Total", key: "total", width: 15 }
    ];

    entregados.forEach(([id, p]) => {
      const enviado = new Date(p.ts || Date.now());
      const items = (p.lineas || []).map(l => `${l.qty}× ${l.nombre}${l.nota ? " (" + l.nota + ")" : ""}`).join("\n");
      ws.addRow({
        codigo: p.codigo || id,
        mesa: p.mesa ?? "—",
        mesero: p.mesero || "—",
        fecha: enviado.toLocaleDateString("es-CO"),
        horaEnviado: enviado.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" }),
        horaEntregado: p.tsCambio ? new Date(p.tsCambio).toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" }) : "—",
        minCocina: p.tsCambio ? Math.max(0, Math.round((p.tsCambio - p.ts) / 60000)) : "—",
        items,
        total: p.total || 0
      });
    });

    const totalGeneral = entregados.reduce((s, [, p]) => s + (p.total || 0), 0);
    const filaTotal = ws.addRow({ items: "TOTAL DEL PERIODO", total: totalGeneral });
    filaTotal.font = { bold: true };
    filaTotal.eachCell({ includeEmpty: true }, cell => {
      cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFEEE7DB" } };
    });

    // Encabezado: fondo terracota, texto blanco, centrado y en negrita.
    const header = ws.getRow(1);
    header.height = 24;
    header.eachCell(cell => {
      cell.font = { bold: true, color: { argb: "FFF9F4ED" }, size: 11 };
      cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFC67139" } };
      cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
    });

    // Todas las celdas de datos, centradas y con bordes suaves; la
    // columna de ítems queda alineada a la izquierda por ser texto largo,
    // pero centrada verticalmente para que se vea prolija igual.
    ws.eachRow((row, rowNumber) => {
      row.height = Math.max(row.height || 0, 20);
      row.eachCell({ includeEmpty: true }, cell => {
        cell.alignment = { horizontal: "center", vertical: "middle", wrapText: true };
        cell.border = {
          top: { style: "thin", color: { argb: "FFE0D8C8" } },
          left: { style: "thin", color: { argb: "FFE0D8C8" } },
          bottom: { style: "thin", color: { argb: "FFE0D8C8" } },
          right: { style: "thin", color: { argb: "FFE0D8C8" } }
        };
      });
      if (rowNumber > 1) row.getCell("items").alignment = { horizontal: "left", vertical: "middle", wrapText: true };
    });

    ws.getColumn("total").numFmt = '"$"#,##0';

    // Filas alternadas para que se lea fácil de un vistazo.
    entregados.forEach((_, i) => {
      if (i % 2 === 1) {
        ws.getRow(i + 2).eachCell({ includeEmpty: true }, cell => {
          cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FFFBF3E8" } };
        });
      }
    });

    ws.autoFilter = { from: "A1", to: "I1" };

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "rodizio-entregados-" + new Date().toISOString().slice(0, 10) + ".xlsx";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {
    alert("No se pudo generar el Excel. Intenta de nuevo.");
  }
  btn.disabled = false; btn.textContent = textoOriginal;
}
document.getElementById("btnExportar").addEventListener("click", exportarExcel);

/* ── Reloj + repintado del tiempo transcurrido ── */
function tickClock() {
  const d = new Date();
  document.getElementById("clock").textContent = d.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
}
setInterval(() => { tickClock(); render(); }, 20000);

/* ── Guard de sesión ── */
function esperarAuthListo() {
  return new Promise((resolve) => {
    (function chequear() {
      if (window.onAuthStateChanged && window.logout) resolve();
      else setTimeout(chequear, 30);
    })();
  });
}

async function iniciar() {
  await esperarAuthListo();
  onAuthStateChanged(async (user) => {
    if (!user) { window.location.href = "../index.html"; return; }
    let perfil;
    try { perfil = await getWorkerProfile(user.uid); }
    catch (e) { window.location.href = "../index.html"; return; }
    if (!perfil || perfil.estado !== "activo" || !hasRole(perfil, "cajero")) {
      await logout();
      window.location.href = "../index.html";
      return;
    }
    document.getElementById("vistaCargando").style.display = "none";
    document.getElementById("app").style.display = "block";
    tickClock();
    conectar();
  });
}

document.getElementById("btnLogout").addEventListener("click", async () => {
  await logout();
  window.location.href = "../index.html";
});

iniciar();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
